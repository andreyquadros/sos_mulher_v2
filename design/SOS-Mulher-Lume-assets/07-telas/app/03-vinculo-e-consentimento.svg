<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Lume — vínculo institucional e consentimento explícito</title><desc id="desc">Conceito visual original Lume Navegador e área reservada SOS Mulher. Sem serviço operacional. Perfis, códigos, estados, tempos e dados são demonstrações. Nunca indica proteção garantida.</desc><rect x="0" y="0" width="390" height="812" rx="0" fill="#F6F8FB"/><text x="22" y="111" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#142D4C" text-anchor="start">Conectar com cuidado</text><text x="22" y="146" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="500" fill="#66798D" text-anchor="start">Antes de começar, confirme seu vínculo</text><text x="22" y="167" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="500" fill="#66798D" text-anchor="start">e entenda o uso de cada recurso.</text><rect x="22" y="197" width="346" height="112" rx="20" fill="white" stroke="#DFE6ED" stroke-width="1"/><image x="39" y="211" width="148" height="35" href="data:image/svg+xml;base64,"/><rect x="274" y="215" width="77" height="28" rx="9" fill="#F0EBF3"/><text x="284" y="234" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#5E2F68" text-anchor="start">A-018</text><text x="39" y="268" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" fill="#66798D" text-anchor="start">Pré-cadastro institucional</text><rect x="39" y="279" width="286" height="28" rx="9" fill="#E4F2EE"/><g transform="translate(48 286) scale(0.5833333333333334)" fill="none" stroke="#258A7B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></g><text x="68" y="298" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#258A7B" text-anchor="start">Vínculo ativo · demonstração</text><text x="22" y="346" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#142D4C" text-anchor="start">Você decide o que compartilhar</text><rect x="22" y="367" width="20" height="20" rx="6" fill="white" stroke="#5E2F68" stroke-width="1"/><text x="53" y="383" font-family="DejaVu Sans, sans-serif" font-size="14.5" font-weight="700" fill="#142D4C" text-anchor="start">Localização no incidente</text><text x="53" y="404" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">GPS somente durante a sessão consentida,</text><text x="53" y="421" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">conforme as permissões do aparelho.</text><rect x="22" y="439" width="20" height="20" rx="6" fill="white" stroke="#5E2F68" stroke-width="1"/><text x="53" y="455" font-family="DejaVu Sans, sans-serif" font-size="14.5" font-weight="700" fill="#142D4C" text-anchor="start">Áudio na sessão · opcional</text><text x="53" y="476" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">Disponibilidade depende das permissões</text><text x="53" y="493" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">e das limitações deste dispositivo.</text><g transform="translate(22 511) scale(0.8333333333333334)" fill="none" stroke="#5E2F68" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12S6 5 12 5s10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></g><text x="53" y="527" font-family="DejaVu Sans, sans-serif" font-size="14.5" font-weight="700" fill="#142D4C" text-anchor="start">Indicadores do sistema</text><text x="53" y="548" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">O celular pode mostrar notificações e</text><text x="53" y="565" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">indicadores de microfone ou localização.</text><rect x="22" y="596" width="346" height="78" rx="15" fill="#EAF0F6"/><g transform="translate(34 611) scale(0.75)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></g><text x="62" y="621" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">O alerta pode seguir sem áudio</text><text x="62" y="638" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">e sem localização. Você pode</text><text x="62" y="655" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">rever estas escolhas depois.</text><rect x="22" y="681" width="346" height="48" rx="15" fill="#5E2F68"/><text x="195.0" y="710.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Confirmar minhas escolhas</text><text x="195" y="741" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="middle">Nenhum compartilhamento começou.</text><rect x="22" y="748" width="346" height="48" rx="15" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(38 762.0) scale(0.8333333333333334)" fill="none" stroke="#153554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H4v16h6m4-14 6 6-6 6m-6-6h12"/></g><text x="204.0" y="777.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#153554" text-anchor="middle">Voltar ao Lume</text><g id="reserved-header"><rect x="0" y="0" width="390" height="76" rx="0" fill="#F6F8FB"/><circle cx="37" cy="39" r="17" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(28 30) scale(0.75)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></g><text x="65" y="44" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#142D4C" text-anchor="start">Área reservada</text><image x="274" y="26" width="94" height="27" href="data:image/svg+xml;base64,"/></g><rect x="0" y="812" width="390" height="32" rx="0" fill="#E9EEF4"/><path d="M0 812L390 812" stroke="#DFE6ED" stroke-width="1" fill="none"/><text x="195" y="833" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#66798D" text-anchor="middle">CONCEITO · DADOS DE DEMONSTRAÇÃO</text></svg>