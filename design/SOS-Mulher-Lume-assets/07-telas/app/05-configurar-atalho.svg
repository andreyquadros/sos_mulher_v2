<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Lume — configuração e treino de gesto compatível</title><desc id="desc">Conceito visual original Lume Navegador e área reservada SOS Mulher. Sem serviço operacional. Perfis, códigos, estados, tempos e dados são demonstrações. Nunca indica proteção garantida.</desc><rect x="0" y="0" width="390" height="812" rx="0" fill="#F6F8FB"/><text x="22" y="111" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#142D4C" text-anchor="start">Um gesto simples.</text><text x="22" y="140" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#142D4C" text-anchor="start">Sempre com teste.</text><text x="22" y="183" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="500" fill="#66798D" text-anchor="start">Escolha uma ação que você consiga</text><text x="22" y="204" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="500" fill="#66798D" text-anchor="start">repetir com segurança neste aparelho.</text><rect x="22" y="235" width="346" height="170" rx="22" fill="white" stroke="#DFE6ED" stroke-width="1"/><circle cx="62" cy="276" r="24" fill="#EAE7EF"/><g transform="translate(49 263) scale(1.0833333333333333)" fill="none" stroke="#5E2F68" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 13V4a2 2 0 0 1 4 0v7l3-1 4 3-1 8H9l-5-7a2 2 0 0 1 3-2Z"/></g><text x="103" y="273" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#142D4C" text-anchor="start">Dentro do aplicativo</text><text x="103" y="295" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#5E2F68" text-anchor="start">Pressione por 3 segundos</text><rect x="42" y="320" width="306" height="44" rx="14" fill="#FBE7EB"/><g transform="translate(60 331) scale(0.9166666666666666)" fill="none" stroke="#A73F54" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 13V4a2 2 0 0 1 4 0v7l3-1 4 3-1 8H9l-5-7a2 2 0 0 1 3-2Z"/></g><text x="207" y="348" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#A73F54" text-anchor="middle">Manter pressionado · 3 s</text><rect x="42" y="360" width="102" height="4" rx="2" fill="#DF5268"/><text x="42" y="383" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">A ação começa com o aplicativo aberto.</text><rect x="22" y="424" width="346" height="131" rx="20" fill="#EAF0F6"/><g transform="translate(38 440) scale(0.9166666666666666)" fill="none" stroke="#153554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 5h4m-3 14h2"/></g><text x="72" y="459" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#142D4C" text-anchor="start">Atalho externo compatível</text><text x="39" y="485" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="500" fill="#66798D" text-anchor="start">Depende do aparelho e da configuração.</text><text x="39" y="504" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="500" fill="#66798D" text-anchor="start">É preciso validar após um teste seguro.</text><text x="39" y="538" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#153554" text-anchor="start">Verificar compatibilidade →</text><rect x="22" y="577" width="346" height="61" rx="15" fill="#EAF0F6"/><g transform="translate(34 592) scale(0.75)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></g><text x="62" y="602" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">Sem palavra-chave sempre ativa.</text><text x="62" y="619" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">Sem comando universal de volume.</text><rect x="22" y="668" width="346" height="48" rx="15" fill="#5E2F68"/><g transform="translate(38 682.0) scale(0.8333333333333334)" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 13V4a2 2 0 0 1 4 0v7l3-1 4 3-1 8H9l-5-7a2 2 0 0 1 3-2Z"/></g><text x="204.0" y="697.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Treinar gesto · sem envio</text><text x="195" y="738" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="middle">Treino não transmite alerta nem áudio.</text><rect x="22" y="748" width="346" height="48" rx="15" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(38 762.0) scale(0.8333333333333334)" fill="none" stroke="#153554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H4v16h6m4-14 6 6-6 6m-6-6h12"/></g><text x="204.0" y="777.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#153554" text-anchor="middle">Voltar ao Lume</text><g id="reserved-header"><rect x="0" y="0" width="390" height="76" rx="0" fill="#F6F8FB"/><circle cx="37" cy="39" r="17" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(28 30) scale(0.75)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></g><text x="65" y="44" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#142D4C" text-anchor="start">Área reservada</text><image x="274" y="26" width="94" height="27" href="data:image/svg+xml;base64,"/></g><rect x="0" y="812" width="390" height="32" rx="0" fill="#E9EEF4"/><path d="M0 812L390 812" stroke="#DFE6ED" stroke-width="1" fill="none"/><text x="195" y="833" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#66798D" text-anchor="middle">CONCEITO · DADOS DE DEMONSTRAÇÃO</text></svg>