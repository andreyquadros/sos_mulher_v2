<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Lume — teste seguro sem transmissão à central</title><desc id="desc">Conceito visual original Lume Navegador e área reservada SOS Mulher. Sem serviço operacional. Perfis, códigos, estados, tempos e dados são demonstrações. Nunca indica proteção garantida.</desc><rect x="0" y="0" width="390" height="812" rx="0" fill="#F6F8FB"/><text x="22" y="111" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#142D4C" text-anchor="start">Este é um teste seguro</text><rect x="22" y="134" width="181" height="28" rx="9" fill="#E4F2EE"/><g transform="translate(31 141) scale(0.5833333333333334)" fill="none" stroke="#258A7B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 8 3v6c0 6-8 11-8 11S4 17 4 11V5Z"/><path d="m8 11 3 3 5-5"/></g><text x="51" y="153" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#258A7B" text-anchor="start">TESTE SIMULADO</text><rect x="22" y="178" width="346" height="80" rx="20" fill="#E4F2EE"/><text x="41" y="209" font-family="DejaVu Sans, sans-serif" font-size="14.5" font-weight="700" fill="#216C61" text-anchor="start">Nenhum alerta será enviado.</text><text x="41" y="232" font-family="DejaVu Sans, sans-serif" font-size="14.5" font-weight="700" fill="#216C61" text-anchor="start">Nenhuma central será acionada.</text><circle cx="195" cy="343" r="62" fill="#EAF0F6"/><circle cx="195" cy="343" r="44" fill="none" stroke="#BACDD8" stroke-width="1"/><circle cx="195" cy="343" r="25" fill="#D6EAED"/><path d="M133 343L257 343" stroke="#C6D9E0" stroke-width="1" fill="none"/><path d="M195 281L195 405" stroke="#C6D9E0" stroke-width="1" fill="none"/><g transform="translate(181 326) scale(1.2083333333333333)" fill="none" stroke="#153554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 9c0 5-6.5 11-6.5 11S5.5 14 5.5 9a6.5 6.5 0 1 1 13 0Z"/><circle cx="12" cy="9" r="2.2"/></g><rect x="132" y="405" width="126" height="28" rx="9" fill="#EAF0F6"/><text x="142" y="424" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#153554" text-anchor="start">Amostra fictícia</text><g transform="translate(25 461) scale(0.875)" fill="none" stroke="#258A7B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 9c0 5-6.5 11-6.5 11S5.5 14 5.5 9a6.5 6.5 0 1 1 13 0Z"/><circle cx="12" cy="9" r="2.2"/></g><text x="59" y="475" font-family="DejaVu Sans, sans-serif" font-size="14.5" font-weight="600" fill="#142D4C" text-anchor="start">Localização de exemplo</text><text x="59" y="496" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">Amostra fictícia, sem coleta real.</text><g transform="translate(25 523) scale(0.875)" fill="none" stroke="#258A7B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></g><text x="59" y="537" font-family="DejaVu Sans, sans-serif" font-size="14.5" font-weight="600" fill="#142D4C" text-anchor="start">Recebimento simulado</text><text x="59" y="558" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">A central não recebe este teste.</text><g transform="translate(25 585) scale(0.875)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9V5a3 3 0 0 1 6 0v7m-3 3a3 3 0 0 1-3-3M5 10v2a7 7 0 0 0 12 5m2-5v-2m-7 9v3m-4 0h8M3 3l18 18"/></g><text x="59" y="599" font-family="DejaVu Sans, sans-serif" font-size="14.5" font-weight="600" fill="#142D4C" text-anchor="start">Áudio neste teste</text><text x="59" y="620" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">Indisponível · sem gravação.</text><rect x="22" y="668" width="346" height="48" rx="15" fill="#5E2F68"/><g transform="translate(38 682.0) scale(0.8333333333333334)" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></g><text x="204.0" y="697.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Concluir teste · simulação</text><text x="195" y="738" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="middle">Sem indicação de despacho de viatura.</text><rect x="22" y="748" width="346" height="48" rx="15" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(38 762.0) scale(0.8333333333333334)" fill="none" stroke="#153554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H4v16h6m4-14 6 6-6 6m-6-6h12"/></g><text x="204.0" y="777.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#153554" text-anchor="middle">Voltar ao Lume</text><g id="reserved-header"><rect x="0" y="0" width="390" height="76" rx="0" fill="#F6F8FB"/><circle cx="37" cy="39" r="17" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(28 30) scale(0.75)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></g><text x="65" y="44" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#142D4C" text-anchor="start">Área reservada</text><image x="274" y="26" width="94" height="27" href="data:image/svg+xml;base64,"/></g><rect x="0" y="812" width="390" height="32" rx="0" fill="#E9EEF4"/><path d="M0 812L390 812" stroke="#DFE6ED" stroke-width="1" fill="none"/><text x="195" y="833" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#66798D" text-anchor="middle">CONCEITO · DADOS DE DEMONSTRAÇÃO</text></svg>