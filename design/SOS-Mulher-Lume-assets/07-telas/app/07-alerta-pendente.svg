<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Lume — envio pendente, fila local e ausência de recebimento</title><desc id="desc">Conceito visual original Lume Navegador e área reservada SOS Mulher. Sem serviço operacional. Perfis, códigos, estados, tempos e dados são demonstrações. Nunca indica proteção garantida.</desc><rect x="0" y="0" width="390" height="812" rx="0" fill="#F6F8FB"/><text x="22" y="111" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#142D4C" text-anchor="start">Envio ainda pendente</text><text x="22" y="148" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="500" fill="#66798D" text-anchor="start">A central ainda não recebeu este alerta.</text><text x="22" y="169" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="500" fill="#66798D" text-anchor="start">Não considere a solicitação entregue.</text><rect x="22" y="194" width="346" height="126" rx="22" fill="#FFF4E7" stroke="#ECD6B9" stroke-width="1"/><g transform="translate(39 213) scale(1.25)" fill="none" stroke="#B87922" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H6a4 4 0 0 1-1-8 7 7 0 0 1 13-3 5.5 5.5 0 0 1 1 11h-2m-5-5v8m-3-3 3 3 3-3"/></g><text x="85" y="234" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#142D4C" text-anchor="start">Sem conexão no momento</text><text x="40" y="269" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#B87922" text-anchor="start">Envio na fila deste aparelho</text><text x="40" y="297" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">Tentativa: 18/10/2026 · 10:21</text><rect x="22" y="339" width="346" height="82" rx="20" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(39 359) scale(1.0)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 9c0 5-6.5 11-6.5 11S5.5 14 5.5 9a6.5 6.5 0 1 1 13 0Z"/><circle cx="12" cy="9" r="2.2"/></g><text x="80" y="371" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#142D4C" text-anchor="start">Localização preparada</text><text x="40" y="400" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">Amostra de demonstração · não enviada</text><rect x="22" y="440" width="346" height="117" rx="20" fill="white" stroke="#DFE6ED" stroke-width="1"/><text x="40" y="468" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#142D4C" text-anchor="start">Última tentativa</text><text x="40" y="493" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#B87922" text-anchor="start">10:21:08 · reconexão pendente</text><text x="40" y="519" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" fill="#66798D" text-anchor="start">Envio na fila não significa alerta</text><text x="40" y="538" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" fill="#66798D" text-anchor="start">recebido pela central.</text><rect x="22" y="580" width="346" height="48" rx="15" fill="#153554"/><g transform="translate(38 594.0) scale(0.8333333333333334)" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7a9 9 0 0 0-15-2L2 8m0-5v5h5M4 17a9 9 0 0 0 15 2l3-3m0 5v-5h-5"/></g><text x="204.0" y="609.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Tentar reconectar · conceito</text><rect x="22" y="641" width="346" height="48" rx="15" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(38 655.0) scale(0.8333333333333334)" fill="none" stroke="#153554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m4 3 4-1 3 5-3 3c1.5 3 3 4.5 6 6l3-3 5 3-1 4c-1 5-9 0-13-4S0 4 4 3Z"/></g><text x="204.0" y="670.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#153554" text-anchor="middle">Abrir discador para contato</text><text x="22" y="718" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">Voltar ao Lume não apaga registros</text><text x="22" y="735" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">ou indicadores do sistema.</text><rect x="22" y="748" width="346" height="48" rx="15" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(38 762.0) scale(0.8333333333333334)" fill="none" stroke="#153554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H4v16h6m4-14 6 6-6 6m-6-6h12"/></g><text x="204.0" y="777.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#153554" text-anchor="middle">Voltar ao Lume</text><g id="reserved-header"><rect x="0" y="0" width="390" height="76" rx="0" fill="#F6F8FB"/><circle cx="37" cy="39" r="17" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(28 30) scale(0.75)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></g><text x="65" y="44" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#142D4C" text-anchor="start">Área reservada</text><image x="274" y="26" width="94" height="27" href="data:image/svg+xml;base64,"/></g><rect x="0" y="812" width="390" height="32" rx="0" fill="#E9EEF4"/><path d="M0 812L390 812" stroke="#DFE6ED" stroke-width="1" fill="none"/><text x="195" y="833" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#66798D" text-anchor="middle">CONCEITO · DADOS DE DEMONSTRAÇÃO</text></svg>