<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Lume — revisão de permissões e indicadores do sistema</title><desc id="desc">Conceito visual original Lume Navegador e área reservada SOS Mulher. Sem serviço operacional. Perfis, códigos, estados, tempos e dados são demonstrações. Nunca indica proteção garantida.</desc><rect x="0" y="0" width="390" height="812" rx="0" fill="#F6F8FB"/><text x="22" y="111" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#142D4C" text-anchor="start">Revisar antes de usar</text><text x="22" y="147" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="500" fill="#66798D" text-anchor="start">Permissões podem mudar a qualquer</text><text x="22" y="168" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="500" fill="#66798D" text-anchor="start">momento nas configurações do celular.</text><rect x="22" y="193" width="346" height="115" rx="20" fill="white" stroke="#DFE6ED" stroke-width="1"/><circle cx="53" cy="226" r="18" fill="#FFF0DE"/><g transform="translate(42 215) scale(0.9166666666666666)" fill="none" stroke="#B87922" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9V5a3 3 0 0 1 6 0v7m-3 3a3 3 0 0 1-3-3M5 10v2a7 7 0 0 0 12 5m2-5v-2m-7 9v3m-4 0h8M3 3l18 18"/></g><text x="84" y="230" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#142D4C" text-anchor="start">Microfone indisponível</text><text x="40" y="263" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" fill="#66798D" text-anchor="start">O alerta pode seguir sem áudio.</text><text x="40" y="291" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#153554" text-anchor="start">Abrir ajuste · demonstração →</text><rect x="22" y="326" width="346" height="115" rx="20" fill="white" stroke="#DFE6ED" stroke-width="1"/><circle cx="53" cy="359" r="18" fill="#EAF0F6"/><g transform="translate(42 348) scale(0.9166666666666666)" fill="none" stroke="#153554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 9c0 5-6.5 11-6.5 11S5.5 14 5.5 9a6.5 6.5 0 1 1 13 0Z"/><circle cx="12" cy="9" r="2.2"/></g><text x="84" y="363" font-family="DejaVu Sans, sans-serif" font-size="16.5" font-weight="700" fill="#142D4C" text-anchor="start">Localização aproximada</text><text x="40" y="396" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" fill="#66798D" text-anchor="start">A precisão pode variar no ambiente.</text><text x="40" y="424" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#153554" text-anchor="start">Revisar ajuste · demonstração →</text><rect x="22" y="459" width="346" height="91" rx="20" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(39 476) scale(1.0)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="18" height="12" rx="2"/><path d="M23 10v4M5 9h9v6H5Z"/></g><text x="79" y="495" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#142D4C" text-anchor="start">Execução do aplicativo</text><text x="40" y="522" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">Restrições de bateria ou fechamento</text><text x="40" y="539" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">podem interromper recursos.</text><rect x="22" y="571" width="346" height="78" rx="15" fill="#EAF0F6"/><g transform="translate(34 586) scale(0.75)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12S6 5 12 5s10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></g><text x="62" y="596" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">O celular pode mostrar notificações e</text><text x="62" y="613" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">indicadores de microfone e localização.</text><text x="62" y="630" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">A interface não altera o sistema.</text><rect x="22" y="681" width="346" height="48" rx="15" fill="#5E2F68"/><g transform="translate(38 695.0) scale(0.8333333333333334)" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7a9 9 0 0 0-15-2L2 8m0-5v5h5M4 17a9 9 0 0 0 15 2l3-3m0 5v-5h-5"/></g><text x="204.0" y="710.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Verificar permissões novamente</text><rect x="22" y="748" width="346" height="48" rx="15" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(38 762.0) scale(0.8333333333333334)" fill="none" stroke="#153554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H4v16h6m4-14 6 6-6 6m-6-6h12"/></g><text x="204.0" y="777.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#153554" text-anchor="middle">Voltar ao Lume</text><g id="reserved-header"><rect x="0" y="0" width="390" height="76" rx="0" fill="#F6F8FB"/><circle cx="37" cy="39" r="17" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(28 30) scale(0.75)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></g><text x="65" y="44" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#142D4C" text-anchor="start">Área reservada</text><image x="274" y="26" width="94" height="27" href="data:image/svg+xml;base64,"/></g><rect x="0" y="812" width="390" height="32" rx="0" fill="#E9EEF4"/><path d="M0 812L390 812" stroke="#DFE6ED" stroke-width="1" fill="none"/><text x="195" y="833" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#66798D" text-anchor="middle">CONCEITO · DADOS DE DEMONSTRAÇÃO</text></svg>