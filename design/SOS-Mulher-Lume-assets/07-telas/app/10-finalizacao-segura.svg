<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Lume — encerramento institucional e cuidado após incidente</title><desc id="desc">Conceito visual original Lume Navegador e área reservada SOS Mulher. Sem serviço operacional. Perfis, códigos, estados, tempos e dados são demonstrações. Nunca indica proteção garantida.</desc><rect x="0" y="0" width="390" height="812" rx="0" fill="#F6F8FB"/><text x="22" y="111" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#142D4C" text-anchor="start">Encerrar com orientação</text><text x="22" y="147" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="500" fill="#66798D" text-anchor="start">Confirme com a central responsável.</text><text x="22" y="168" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="500" fill="#66798D" text-anchor="start">Não encerre só porque a tela mudou.</text><rect x="22" y="194" width="346" height="145" rx="22" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(39 212) scale(1.0833333333333333)" fill="none" stroke="#5E2F68" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 8 3v6c0 6-8 11-8 11S4 17 4 11V5Z"/><path d="m8 11 3 3 5-5"/></g><text x="80" y="233" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#142D4C" text-anchor="start">Confirmação da central</text><text x="40" y="264" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#258A7B" text-anchor="start">Encerramento confirmado · demonstração</text><text x="40" y="289" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" fill="#66798D" text-anchor="start">A-018 · 18/10/2026 · 10:38</text><rect x="40" y="303" width="258" height="28" rx="9" fill="#FFF4E7"/><text x="50" y="322" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#B87922" text-anchor="start">Validação institucional necessária</text><text x="22" y="370" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" fill="#66798D" text-anchor="start">Este conceito prevê um fluxo PC/PM</text><text x="22" y="390" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="500" fill="#66798D" text-anchor="start">formalmente validado antes da operação.</text><rect x="22" y="425" width="346" height="169" rx="22" fill="#F0EBF3"/><g transform="translate(39 443) scale(1.0416666666666667)" fill="none" stroke="#5E2F68" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 4.5a5 5 0 0 0-7 0L12 6l-1.5-1.5a5 5 0 0 0-7 7L12 20l8.5-8.5a5 5 0 0 0 0-7Z"/></g><text x="79" y="463" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#5E2F68" text-anchor="start">Cuidado depois do incidente</text><g transform="translate(40 483) scale(0.7916666666666666)" fill="none" stroke="#5E2F68" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 4.5a5 5 0 0 0-7 0L12 6l-1.5-1.5a5 5 0 0 0-7 7L12 20l8.5-8.5a5 5 0 0 0 0-7Z"/></g><text x="71" y="498" font-family="DejaVu Sans, sans-serif" font-size="13.3" font-weight="600" fill="#142D4C" text-anchor="start">Consultar orientações de apoio</text><g transform="translate(338 485) scale(0.625)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g><g transform="translate(40 517) scale(0.7916666666666666)" fill="none" stroke="#5E2F68" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5Zm9 0v6h5M9 12h6m-6 4h6"/></g><text x="71" y="532" font-family="DejaVu Sans, sans-serif" font-size="13.3" font-weight="600" fill="#142D4C" text-anchor="start">Ver histórico reservado</text><g transform="translate(338 519) scale(0.625)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g><g transform="translate(40 551) scale(0.7916666666666666)" fill="none" stroke="#5E2F68" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m10 2-.5 3-2 1-3-.5L2 9l2.5 2v2L2 15l2.5 3.5 3-.5 2 1 .5 3h4l.5-3 2-1 3 .5L22 15l-2.5-2v-2L22 9l-2.5-3.5-3 .5-2-1-.5-3Z"/><circle cx="12" cy="12" r="3"/></g><text x="71" y="566" font-family="DejaVu Sans, sans-serif" font-size="13.3" font-weight="600" fill="#142D4C" text-anchor="start">Revisar permissões do aparelho</text><g transform="translate(338 553) scale(0.625)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g><rect x="22" y="615" width="346" height="78" rx="15" fill="#EAF0F6"/><g transform="translate(34 630) scale(0.75)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></g><text x="62" y="640" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">Mudar para o Lume não remove registros,</text><text x="62" y="657" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">notificações ou indicadores mantidos</text><text x="62" y="674" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="500" fill="#66798D" text-anchor="start">pelo sistema do celular.</text><rect x="22" y="712" width="346" height="28" rx="15" fill="#5E2F68"/><g transform="translate(38 716.0) scale(0.8333333333333334)" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></g><text x="204.0" y="731.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Voltar ao acompanhamento</text><rect x="22" y="748" width="346" height="48" rx="15" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(38 762.0) scale(0.8333333333333334)" fill="none" stroke="#153554" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H4v16h6m4-14 6 6-6 6m-6-6h12"/></g><text x="204.0" y="777.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#153554" text-anchor="middle">Voltar ao Lume</text><g id="reserved-header"><rect x="0" y="0" width="390" height="76" rx="0" fill="#F6F8FB"/><circle cx="37" cy="39" r="17" fill="white" stroke="#DFE6ED" stroke-width="1"/><g transform="translate(28 30) scale(0.75)" fill="none" stroke="#66798D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></g><text x="65" y="44" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#142D4C" text-anchor="start">Área reservada</text><image x="274" y="26" width="94" height="27" href="data:image/svg+xml;base64,"/></g><rect x="0" y="812" width="390" height="32" rx="0" fill="#E9EEF4"/><path d="M0 812L390 812" stroke="#DFE6ED" stroke-width="1" fill="none"/><text x="195" y="833" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#66798D" text-anchor="middle">CONCEITO · DADOS DE DEMONSTRAÇÃO</text></svg>