name: lume_navegador
description: Navegador discreto e proteção consentida SOS Mulher.
publish_to: none
version: 2.3.0+5
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/reserved/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
