upstream sos_api {
    # Docker pode mudar o IP da API ao recriar o container.
    zone sos_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api:3001 resolve;
}

map $uri $sos_panel_cache_control {
    ~^/api/ "";
    default "no-store";
}

map $uri $sos_apk_disposition {
    /downloads/lume-navegador.apk 'attachment; filename="lume-navegador.apk"';
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    client_max_body_size 512k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $sos_panel_cache_control always;
    add_header Content-Disposition $sos_apk_disposition;
    location = /downloads/lume-navegador.apk {
        alias /srv/lume-downloads/lume-navegador.apk;
        disable_symlinks on from=/srv/lume-downloads;
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
    }
    location = /downloads { return 404; }
    location ^~ /downloads/ { return 404; }
    location /api/ {
        location ~ ^/api/women/[0-9A-Fa-f-]+/attachments$ {
            client_max_body_size 5m;
            proxy_request_buffering off;
        }
        proxy_pass http://sos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
