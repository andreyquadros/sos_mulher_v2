services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_PATH: /data/mulher-lume.sqlite
      PANEL_ORIGIN: ${PANEL_ORIGIN:?Configure PANEL_ORIGIN com o dominio HTTPS institucional}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administracao}
      AGENCY_ID: ${AGENCY_ID:-ro-ariquemes}
      TRUST_PROXY_HOPS: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(response => { if (!response.ok) process.exitCode = 1; })"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - sos-data:/data
    networks: [internal]
  panel:
    build:
      context: .
      dockerfile: deploy/Dockerfile.panel
      args:
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
        VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-}
    restart: unless-stopped
    ports: ["127.0.0.1:${PANEL_BIND_PORT:-8080}:80"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [internal]
volumes:
  sos-data:
networks:
  internal:
